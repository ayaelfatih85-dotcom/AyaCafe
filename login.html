
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Aya Café</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #F7F1E8;
    color: #4B3028;
}

header {
    background: #4B3028;
    color: white;
    padding: 18px;
    text-align: center;
}

.box {
    background: white;
    max-width: 420px;
    margin: 40px auto;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 12px #0002;
}

h2 { text-align: center; }

label {
    display: block;
    margin: 15px 0 7px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #c9b8a8;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    border: 0;
    border-radius: 8px;
    background: #8B5E3C;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

a {
    color: #8B5E3C;
    text-decoration: none;
}

.links {
    text-align: center;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Aya Café ☕</h1>
</header>

<div class="box">

    <h2>تسجيل الدخول ❤️</h2>

    <form id="loginForm">

        <label>اسم المستخدم</label>
        <input type="text" id="username"
               placeholder="اكتب اسم المستخدم"
               required>

        <label>كلمة المرور</label>
        <input type="password" id="password"
               placeholder="اكتب كلمة المرور"
               required>

        <button type="submit">دخول</button>

    </form>

    <div class="links">
        <p>ما عندك حساب؟</p>
        <a href="register.html">إنشاء حساب جديد</a>
        <p><a href="index.html">العودة للرئيسية</a></p>
    </div>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (username === "Aya" && password === "43140") {

        localStorage.setItem("ayaLoggedIn", "true");

        localStorage.setItem("ayaCurrentUser",
            JSON.stringify({
                name: "Aya",
                username: "Aya"
            })
        );

        alert("أهلاً بيك في Aya Café ❤️");

        window.location.href = "index.html";

    } else {

        alert("اسم المستخدم أو كلمة المرور غير صحيحة!");

    }

});
</script>

</body>
</html>
