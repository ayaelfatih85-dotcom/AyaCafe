<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب أوردر | كافي آية</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

  
<header style="background:#4B3028;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;">
    <strong style="font-size:23px;">Aya Café ☕</strong>

    <div style="position:relative;">
        <button onclick="document.getElementById('myMenu').classList.toggle('show')"
        style="background:none;color:white;border:0;font-size:30px;cursor:pointer;">
            ☰
        </button>

        <div id="myMenu" class="show-menu">
            <a href="index.html">الرئيسية</a>
            <a href="menu.html">المنيو</a>
            <a href="order.html">اطلب الآن</a>
            <a href="comments.html">التعليقات</a>
            <a href="contact.html">تواصل معنا</a>
            <a href="register.html">إنشاء حساب</a>
            <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>
</header>

<style>
.show-menu {
    display:none;
    position:absolute;
    left:0;
    top:45px;
    width:180px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    z-index:100;
    box-shadow:0 4px 10px #0003;
}
.show-menu.show { display:block; }
.show-menu a {
    display:block;
    padding:12px;
    color:#4B3028;
    text-decoration:none;
}
.show-menu a:hover { background:#F0E2D2; }
</style>


<header>
    <h1>🛍️ طلب أوردر</h1>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="menu.html">المنيو</a>
        <a href="order.html">طلب أوردر</a>
        <a href="comments.html">التعليقات</a>
        <a href="contact.html">تواصل معنا</a>
    </nav>
</header>

<main class="container">

    <form id="orderForm">

        <h2>اطلب من كافي آية</h2>

        <label for="customerName">الاسم الكامل</label>
        <input
            type="text"
            id="customerName"
            maxlength="100"
            required
        >

        <label for="phone">رقم الهاتف</label>
        <input
            type="tel"
            id="phone"
            maxlength="30"
            required
        >

        <label for="item">اختاري الصنف</label>
        <select id="item" required>
            <option value="">اختاري من المنيو</option>
            <option value="إسبريسو">إسبريسو - 15500 جنيه</option>
            <option value="كابتشينو">كابتشينو - 15000 جنيه</option>
            <option value="لاتيه">لاتيه - 14000 جنيه</option>
            <option value="موكا">موكا - 14500 جنيه</option>
            <option value="آيس كوفي">آيس كوفي - 20000 جنيه</option>
            <option value="كيك الشوكولاتة">كيك الشوكولاتة - 20000 جنيه</option>
        </select>

        <label for="quantity">الكمية</label>
        <input
            type="number"
            id="quantity"
            min="1"
            max="50"
            value="1"
            required
        >

        <label for="notes">ملاحظات إضافية</label>
        <textarea
            id="notes"
            maxlength="1000"
            placeholder="أي ملاحظات عن طلبك..."
        ></textarea>

        <button type="submit" class="btn full">
            إرسال الطلب
        </button>

        <p id="orderMessage" class="message"></p>

    </form>

</main>

<footer>
    <p>شكراً لاختيارك كافي آية ☕</p>
</footer>

<script src="script.js"></script>

</body>
</html>
